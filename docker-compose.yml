services:
  db:
    image: postgres:17
    container_name: bank-service-db
    ports:
      - "5439:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-bank-service}
    volumes:
      - ./data/db:/var/lib/postgresql/data
